# Runs Eats on the server (omarchy). See deploy/README.md.
#
#   docker compose up -d --build     start or update
#   docker compose logs -f           watch the logs
#   docker compose down              stop
#
# Settings and secrets come from the .env file next to this one, which only
# exists on the server (never in git).

services:
  eats:
    build: .
    restart: unless-stopped
    ports:
      # Only reachable from the server itself. Tailscale Funnel forwards the
      # public https://….ts.net address to this port.
      - '127.0.0.1:3000:3000'
    env_file: .env
    environment:
      DATABASE_PATH: /data/eats.db
    # Eats is public, so it runs locked down: nothing outside /data and /tmp
    # can be written, it can't gain privileges, and it can't use up the
    # server's memory or processes, which other apps share.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 256
    volumes:
      # The database file lives here on the server. Back up this folder.
      - ./data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/pick').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
