# The container settings omarchy actually uses for Eats.
#
# Andrei installs this at ~/eats-server/docker-compose.yml, OUTSIDE the app's
# git checkout. Deploys only update the app's code in ~/apps/eats; what the
# container is allowed to do is decided here, and only Andrei can change it.
# (The docker-compose.yml at the repo root is for running locally.)
#
# To change these settings: edit this file in the repo, push, and Andrei
# copies it over (see deploy/README.md). Nothing a deploy does can change it.

# Same project name as before, so this replaces the existing container.
name: eats

services:
  eats:
    build: ${HOME}/apps/eats
    restart: unless-stopped

    # ── The lockdown ───────────────────────────────────────────────────────
    # Pinned here rather than trusting the Dockerfile: even if a pushed
    # Dockerfile asked to run as root, the app still runs as 10001, not as
    # Andrei's login (1000) and not as root.
    user: '10001:10001'
    # Nothing outside /data and /tmp can be written.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # No special powers, and no way to gain any.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Can't use up the memory or processes other apps on omarchy need.
    mem_limit: 512m
    pids_limit: 256
    # Only reachable from omarchy itself; Tailscale Funnel forwards the public
    # https://omarchy.tail7e4bac.ts.net:8443 address to this port.
    ports:
      - '127.0.0.1:3000:3000'
    # ───────────────────────────────────────────────────────────────────────

    # Secrets (owner passcode, Claude API key) and the database stay where they
    # already are; the only thing mounted from omarchy is the data folder.
    env_file: ${HOME}/apps/eats/.env
    environment:
      DATABASE_PATH: /data/eats.db
    volumes:
      - ${HOME}/apps/eats/data:/data

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/pick').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
